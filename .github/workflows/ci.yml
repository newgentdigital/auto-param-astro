name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for the DeepSource CLI to authenticate over OIDC.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          # On pull_request, checkout defaults to the ephemeral merge commit,
          # which does not exist upstream. DeepSource cannot attribute coverage
          # to it, so check out the pull request head instead.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # No step needs authenticated git after checkout.
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test with coverage
        run: bun run test:coverage

      - name: Build
        run: bun run build

      # Fork pull requests cannot mint an OIDC token, so skip rather than fail.
      - name: Report coverage to DeepSource
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        run: |
          curl -fsSL https://cli.deepsource.com/install | BINDIR=./bin sh
          ./bin/deepsource report \
            --analyzer test-coverage \
            --key javascript \
            --value-file ./coverage/lcov.info \
            --use-oidc
