name: Delete old workflow runs

on:
  schedule:
    - cron: "0 3 * * *" # Run daily at 03:00 UTC
  workflow_dispatch:

jobs:
  delete-runs:
    name: Delete runs older than 7 days
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Run delete-workflow-runs
        uses: Mattraks/delete-workflow-runs@v2.1.0
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 7
          keep_minimum_runs: 0
