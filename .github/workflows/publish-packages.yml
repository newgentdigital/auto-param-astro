name: Publish to npm and GitHub Packages

on:
  release:
    types: [published]
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish integration as package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          # Publish the tagged commit, not whatever main happens to point at.
          ref: ${{ github.event.release.tag_name || github.ref }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test package
        run: bun test

      - name: Build package
        run: bun run build

      - name: Setup Node with npm registry
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # This job holds an OIDC token; a poisoned dependency cache could
          # expose it to attacker-controlled code. Nothing here needs the cache.
          package-manager-cache: false

      - name: Publish package to npm
        run: npm publish --provenance --access public

      - name: Setup Node with GitHub Packages registry
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@newgentdigital"
          package-manager-cache: false

      - name: Publish package to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
