name: Find leaked secrets

on:
  pull_request:
  # Scoped to main: an unfiltered push trigger scans every pull request twice,
  # once for the push and once for the pull_request event.
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  trufflehog:
    name: Scan full repository history
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          # Full history: the scan runs from the start of the repository.
          fetch-depth: 0
          persist-credentials: false

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@v3.97.1
        with:
          base: ""
          head: ${{ github.ref_name }}
          extra_args: --results=verified,unknown
